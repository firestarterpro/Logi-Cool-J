        - open: "C:\\Templar Archives\\Arbiter Tribunal\\Basketball Officiating\\On the Whistle\\Ref Text Confirm\\pc-only-ref-drafts\\dist\\RefDrafts-win32-x64\\RefDrafts.exe"
    - id: 4
      label: "DeepSeek"
      icon: "deepseek"
