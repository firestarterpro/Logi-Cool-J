# ============================================================================
# MX Creative Console — 10-page keypad layout
# Refreshed 2026-11-11 for kcorn, Windows 11 (v1 copy: keypad-layout.v1-backup.yaml)
# Format: keypad YAML, contract in HANDOUT-keypad-addon.md.
# Build:  python yaml2lp5.py  →  "MX 10-Page Layout.lp5"  →  import in Options+
# Numbering: button 0 = top-left, 8 = bottom-right (row-major, 3x3 grid)
# Rules:
#   - Every step is one action: key | text | wait | url | open | run | go_to_page
#   - go_to_page must be the button's only step
#   - No passwords / API keys anywhere (the .lp5 is a plain zip)
#   - Text steps stop before Enter/Tab (you finish manually)
#   - CHECK comments = path or name that only the device can confirm
# Pages: 1 AI Scripts · 2 Home · 3 DeepSeek · 4 Cursor · 5 Terminal ·
#        6 Research · 7 Capture · 8 Files · 9 Windows · 10 Index
# Every page has Home on 8 (Home's own 8 goes to Index).
# ============================================================================

profile_name: "MX 10-Page Layout"
profile_page_count: 10

# ---------------------------------------------------------------------------
# Page 1 — AI Scripts (stacks-attacks\tools\ai-scripts, see its README.md)
# Open DL / Open Clip / Copy / Recycle run AiScript.ps1 directly through pwsh,
# so they need no PowerToys row. Run uses Cursor's own shortcut (needs the
# Cursor task + keybinding from cursor-tasks.json / cursor-keybindings.json).
# CHECK: AiScript.ps1 is on GitHub main (adc26cf); run stacks-attacks-pull.bat
#        once so it exists at the path below.
# Fallback if a pwsh key does nothing on the device: change it to the
# PowerToys shortcut from the ai-scripts README (D / V / C / X with
# Ctrl+Alt+Shift).
# ---------------------------------------------------------------------------
page_1:
  name: "AI Scripts"
  buttons:
    - id: 0
      label: "Open DL"
      icon: "download"
      steps:
        - open: "pwsh.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"C:\\Templar Archives\\Cybernetics Core\\stacks-attacks\\tools\\ai-scripts\\AiScript.ps1\" -Action OpenDownload"
    - id: 1
      label: "Open Clip"
      icon: "clipboard"
      steps:
        - open: "pwsh.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"C:\\Templar Archives\\Cybernetics Core\\stacks-attacks\\tools\\ai-scripts\\AiScript.ps1\" -Action OpenClipboard"
    - id: 2
      label: "Run Script"
      icon: "play"
      steps:
        # Open the script in Cursor first; Cursor must be the active window.
        - key: "Ctrl+Alt+Shift+R"
    - id: 3
      label: "Copy Result"
      icon: "copy"
      steps:
        - open: "pwsh.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"C:\\Templar Archives\\Cybernetics Core\\stacks-attacks\\tools\\ai-scripts\\AiScript.ps1\" -Action Copy"
    - id: 4
      label: "Recycle Run"
      icon: "recycle"
      steps:
        - open: "pwsh.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"C:\\Templar Archives\\Cybernetics Core\\stacks-attacks\\tools\\ai-scripts\\AiScript.ps1\" -Action Recycle"
    - id: 5
      label: "Ask Cursor"
      icon: "robot"
      steps:
        - key: "Ctrl+L"
    - id: 6
      label: "To Cursor"
      icon: "cursor"
      steps:
        # Brings Cursor to the front (or starts it) so Run Script lands there.
        - open: "C:\\Users\\kcorn\\AppData\\Local\\Programs\\Cursor\\Cursor.exe"
    - id: 7
      label: "Index"
      icon: "list"
      steps:
        - go_to_page: 10
    - id: 8
      label: "Home"
      icon: "home"
      steps:
        - go_to_page: 2

# ---------------------------------------------------------------------------
