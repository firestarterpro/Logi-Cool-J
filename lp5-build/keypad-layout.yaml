# ============================================================================
# MX Creative Console — 10-page keypad layout
# Generated 2026-10-28 for kcorn, Windows 11
# Format: Loupedeck keypad YAML (consumed by build-json.ps1 → keypad-layout.json)
# Numbering: button 0 = top-left, 8 = bottom-right (row-major, 3x3 grid)
# Rules:
#   - Every step is one action: key | text | open | url | run | wait
#   - No passwords / API keys anywhere
#   - Anything marked ✏️ stops before Enter/Tab (you finish manually)
#   - # EDIT comments = the path could not be verified on disk
# ============================================================================

profile_name: "MX 10-Page Layout"
profile_page_count: 10

# ---------------------------------------------------------------------------
# Page 1 — Home (hub)
# ---------------------------------------------------------------------------
page_1:
  name: "Home"
  buttons:
    - id: 0
      label: "DeepSeek"
      icon: "deepseek"
      steps:
        - url: "https://chat.deepseek.com"
        - wait: 1500
    - id: 1
      label: "CursorCline"
      icon: "cursor"
      steps:
        # run+key fallback (portable): launch Cursor, wait, open Cline
        - open: "C:\\Users\\kcorn\\AppData\\Local\\Programs\\Cursor\\Cursor.exe"
        - wait: 4000
        - key: "Ctrl+Alt+L"
    - id: 2
      label: "Terminal"
      icon: "terminal"
      steps:
        - open: "wt.exe"
    - id: 3
      label: "Perplexity"
      icon: "globe"
      steps:
        - url: "https://perplexity.ai"
        - wait: 1500
    - id: 4
      label: "Browser"
      icon: "browser"
      steps:
        - open: "msedge.exe"
    - id: 5
      label: "Files"
      icon: "folder"
      steps:
        - key: "Win+E"
        - wait: 800
        # EDIT: change this subfolder if you want a specific project
        - text: "C:\\Templar Archives"
        - key: "Return"
    - id: 6
      label: "Capture"
      icon: "camera"
      steps:
        - go_to_page: 6
    - id: 7
      label: "Windows"
      icon: "window"
      steps:
        - go_to_page: 8
    - id: 8
      label: "Index"
      icon: "list"
      steps:
        - go_to_page: 10

# ---------------------------------------------------------------------------
# Page 2 — DeepSeek
# All ✏️ items stop BEFORE Enter/Tab. You press Enter/Tab when ready.
# ---------------------------------------------------------------------------
page_2:
  name: "DeepSeek"
  buttons:
    - id: 0
      label: "Open DS"
      icon: "deepseek"
      steps:
        - url: "https://chat.deepseek.com"
        - wait: 1500
    - id: 1
      label: "/new"
      icon: "plus"
      steps:
        - text: "/new"
    - id: 2
      label: "/search"
      icon: "search"
      steps:
        - text: "/search "
    - id: 3
      label: "/summarize"
      icon: "doc"
      steps:
        - text: "/summarize "
    - id: 4
      label: "/compress"
      icon: "shrink"
      steps:
        - text: "/compress "
    - id: 5
      label: "/export"
      icon: "download"
      steps:
        - text: "/export "
    - id: 6
      label: "/short"
      icon: "scissors"
      steps:
        - text: "/short "
    - id: 7
      label: "/review"
      icon: "eye"
      steps:
        - text: "/review "
    - id: 8
      label: "Home"
      icon: "home"
      steps:
        - go_to_page: 1

# ---------------------------------------------------------------------------
# Page 3 — Cursor + Cline (VS Code default shortcuts)
# ---------------------------------------------------------------------------
page_3:
  name: "Cursor+Cline"
  buttons:
    - id: 0
      label: "Cursor"
      icon: "cursor"
      steps:
        - open: "C:\\Users\\kcorn\\AppData\\Local\\Programs\\Cursor\\Cursor.exe"
    - id: 1
      label: "ShowCline"
      icon: "robot"
      steps:
        - key: "Ctrl+Alt+L"
    - id: 2
      label: "CmdPal"
      icon: "palette"
      steps:
        - key: "Ctrl+Shift+P"
    - id: 3
      label: "QuickOpen"
      icon: "zap"
      steps:
        - key: "Ctrl+P"
    - id: 4
      label: "Terminal"
      icon: "terminal"
      steps:
        - key: "Ctrl+`"
    - id: 5
      label: "Problems"
      icon: "warn"
      steps:
        - key: "Ctrl+Shift+M"
    - id: 6
      label: "SourceCtrl"
      icon: "git"
      steps:
        - key: "Ctrl+Shift+G"
    - id: 7
      label: "OpenFolder"
      icon: "folder"
      steps:
        - key: "Ctrl+K"
        - key: "Ctrl+O"
    - id: 8
      label: "Home"
      icon: "home"
      steps:
        - go_to_page: 1

