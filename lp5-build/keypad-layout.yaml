# ---------------------------------------------------------------------------
# Dials (informational — apply manually in Options+)
# Loupedeck stores dial bindings in a separate file that's easy to corrupt on
# re-import, so these are documented here and NOT written into the JSON.
# ---------------------------------------------------------------------------
dials:
  general: "Scroll"
  deepseek: "Scroll long answers"
  cursor: "Switch editor tabs"
  windows: "Switch virtual desktops"
  media: "Volume"
  roller: "Zoom / fine scroll (per profile — verify exact options)"
