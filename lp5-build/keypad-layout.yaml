# ---------------------------------------------------------------------------
# Page 6 — Capture & clipboard
# ---------------------------------------------------------------------------
page_6:
  name: "Capture"
  buttons:
    - id: 0
      label: "ClipHist"
      icon: "clipboard"
      steps:
        - key: "Win+V"
    - id: 1
      label: "Screenshot"
      icon: "camera"
      steps:
        - key: "Win+Shift+S"
    - id: 2
      label: "PlainPaste"
      icon: "paste"
      steps:
        - key: "Ctrl+Shift+V"
    - id: 3
      label: "Clip→txt"
      icon: "doc"
      steps:
        # Paste clipboard into new Notepad and save (your old Page 2 button 0)
        - open: "notepad.exe"
        - wait: 1200
        - key: "Ctrl+V"
        - wait: 200
        - key: "Ctrl+S"
    - id: 4
      label: "HTMLRender"
      icon: "image"
      steps:
        - key: "Ctrl+Alt+R"
    - id: 5
      label: "RenderOut"
      icon: "folder"
      steps:
        # EDIT: point at the output folder you configured
        - open: "C:\\Users\\kcorn\\OneDrive\\Documents"
    - id: 6
      label: "SwitchPaste"
      icon: "swap"
      steps:
        - key: "Ctrl+C"
        - wait: 200
        - key: "Alt+Tab"
        - wait: 500
        - key: "Ctrl+V"
    - id: 7
      label: "Dictate"
      icon: "mic"
      steps:
        - key: "Win+H"
    - id: 8
      label: "Home"
      icon: "home"
      steps:
        - go_to_page: 1

