# ============================================================================
# keys.yaml: logi-cool-j 2 layout (10 pages x 9 keys). The plugin reloads this
# file a moment after you save it; a bad file keeps the last good layout and
# shows the line number on a key and in a Windows notification.
# Contract: lp5-build\HANDOUT-keypad-addon.md, plus
#   paths:      ${name} variables for text/url/open/run steps
#   color:      optional per key, "#RRGGBB"
#   text_mode:  "type" (default) or "paste" (clipboard), top level or per key
# Editor: v2\editor\keys-editor.html (saving there rewrites this file and drops comments).
# Made by migrate_keys.py from lp5-build\keypad-layout.yaml.
# ============================================================================

profile_name: "MX 10-Page Layout"
profile_page_count: 10
text_mode: "type"

# Folders and programs used below. Change a value here and every key follows.
paths:
  templar: "C:\\Templar Archives"
  ai_scripts: "${templar}\\stacks-attacks\\tools\\ai-scripts"
  gateway: "${templar}\\Templar Nexus\\dist\\TheGateway\\TheGateway.exe"
  ai_control_center: "${templar}\\ai-control-center\\app\\dist\\AI Control Center.exe"
  ref_drafts: "${templar}\\Basketball Bro\\Ref Text Confirm\\pc-only-ref-drafts"
  beer_league: "${templar}\\Basketball Bro\\beer-league"
  html_render: "${templar}\\My Apps\\html-render"
  logi_cool_j: "${templar}\\My Apps\\Logi.Cool.J"
  cursor: "C:\\Users\\kcorn\\AppData\\Local\\Programs\\Cursor\\Cursor.exe"
  llm_explorer: "C:\\llm-explorer"
  documents: "C:\\Users\\kcorn\\OneDrive\\Documents"
  options_plus: "C:\\Program Files\\LogiOptionsPlus\\logioptionsplus.exe"

page_1:
  name: "AI Scripts"
  buttons:
    - id: 0
      label: "Open DL"
      icon: "download"
      steps:
        - open: "pwsh.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"${ai_scripts}\\AiScript.ps1\" -Action OpenDownload"
    - id: 1
      label: "Open Clip"
      icon: "clipboard"
      steps:
        - open: "pwsh.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"${ai_scripts}\\AiScript.ps1\" -Action OpenClipboard"
    - id: 2
      label: "Run Script"
      icon: "play"
      steps:
        - key: "Ctrl+Alt+Shift+R"
    - id: 3
      label: "Copy Result"
      icon: "copy"
      steps:
        - open: "pwsh.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"${ai_scripts}\\AiScript.ps1\" -Action Copy"
    - id: 4
      label: "Recycle Run"
      icon: "recycle"
      steps:
        - open: "pwsh.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"${ai_scripts}\\AiScript.ps1\" -Action Recycle"
    - id: 5
      label: "Ask Cursor"
      icon: "robot"
      steps:
        - key: "Ctrl+L"
    - id: 6
      label: "To Cursor"
      icon: "cursor"
      steps:
        - open: "${cursor}"
    - id: 7
      label: "Index"
      icon: "list"
      steps:
        - go_to_page: 10
    - id: 8
      label: "Home"
      icon: "home"
      steps:
        - go_to_page: 2

